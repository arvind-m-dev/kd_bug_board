<!doctype html><html class="dark" data-skin="halloween" data-motion="lively"><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>3D Halloween visual check</title><style>body{margin:0;font:14px system-ui}.bf-sidebar{padding:22px;width:220px!important}.bf-topbar{margin-left:220px}main{margin-left:220px;padding:32px}.bf-status-cards{display:flex!important}.bf-status-card{flex:1;padding:20px!important;min-height:100px}.bf-table-wrap{border:1px solid #553b69;border-radius:10px}td,th{padding:22px!important}button{cursor:pointer}small{opacity:.6}</style></head><body><aside class="bf-sidebar"><h2>Seasonal studio</h2><p>Local animation check</p><small>Fixture content · no live records</small><p id="result">Ready</p></aside><div class="bf-topbar">Workspace / 3D Halloween preview</div><main><div class="bf-page-heading"><h1>Halloween in motion</h1><p>Tree roosts, flying bats, descending spiders and crawling beetles</p></div><div class="bf-status-cards"><button class="bf-status-card">Reports<strong>Preview box</strong></button><button class="bf-status-card">In progress<strong>Preview box</strong></button><button class="bf-status-card">Awaiting QA<strong>Preview box</strong></button></div><div class="bf-table-wrap"><table class="bf-table"><thead><tr><th>Select</th><th>Preview item</th><th>Status</th></tr></thead><tbody></tbody></table></div></main><div id="scene" class="bf-seasonal-3d" aria-hidden="true" inert></div><script type="module">import '/src/styles.css';import {createSeasonalScene} from '/src/components/bugflow/seasonal-scene.ts';const t=document.querySelector('tbody');for(let i=1;i<7;i++){const r=document.createElement('tr');r.innerHTML=`<td><input type="checkbox" aria-label="Select preview ${i}"></td><td>Table interaction check ${i}</td><td>Ready for review</td>`;t.append(r)}t.onchange=()=>document.getElementById('result').textContent=`${t.querySelectorAll(':checked').length} selected`;document.querySelectorAll('button').forEach(b=>b.onclick=()=>document.getElementById('result').textContent='Card click works');const host=document.getElementById('scene');createSeasonalScene(host,'halloween',true);host.dataset.ready='true';</script></body></html>
